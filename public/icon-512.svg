<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#B3D4FC"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pin" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Circuit lines (decorative) -->
  <g stroke="#93C5FD" stroke-width="1.5" opacity="0.3" fill="none">
    <line x1="300" y1="100" x2="380" y2="60"/>
    <circle cx="380" cy="60" r="3" fill="#93C5FD"/>
    <line x1="320" y1="80" x2="400" y2="40"/>
    <circle cx="400" cy="40" r="3" fill="#93C5FD"/>
    <line x1="340" y1="120" x2="410" y2="90"/>
    <circle cx="410" cy="90" r="3" fill="#93C5FD"/>
    <line x1="310" y1="140" x2="390" y2="130"/>
    <circle cx="390" cy="130" r="3" fill="#93C5FD"/>
    <line x1="300" y1="170" x2="370" y2="170"/>
    <circle cx="370" cy="170" r="3" fill="#93C5FD"/>
  </g>
  <!-- White circle with shadow -->
  <circle cx="270" cy="200" r="110" fill="white" filter="url(#shadow)"/>
  <!-- Blue cable/cord wrapping -->
  <path d="M180 130 C110 130 80 195 80 230 C80 290 130 320 185 320 L330 320 C380 320 410 280 410 230 C410 190 394 150 368 130"
        fill="none" stroke="url(#plug)" stroke-width="18" stroke-linecap="round"/>
  <!-- Plug body -->
  <rect x="140" y="95" width="64" height="50" rx="10" fill="url(#plug)"/>
  <!-- Plug prongs -->
  <rect x="155" y="68" width="10" height="34" rx="4" fill="#CBD5E1"/>
  <rect x="179" y="68" width="10" height="34" rx="4" fill="#CBD5E1"/>
  <!-- Lightning bolt on plug -->
  <path d="M176 103 L166 118 L176 118 L168 135 L184 114 L174 114 L182 103Z" fill="#FBBF24"/>
  <!-- Location pin -->
  <path d="M270 140 C238 140 214 164 214 192 C214 228 270 280 270 280 C270 280 326 228 326 192 C326 164 302 140 270 140Z" fill="url(#pin)"/>
  <!-- Battery icon inside pin -->
  <rect x="248" y="170" width="44" height="30" rx="5" fill="white" opacity="0.95"/>
  <rect x="292" y="178" width="7" height="10" rx="2" fill="white" opacity="0.95"/>
  <!-- Battery fill -->
  <rect x="252" y="174" width="20" height="22" rx="3" fill="#22C55E"/>
  <!-- Lightning in battery -->
  <path d="M265 174 L259 186 L265 186 L260 196 L272 183 L266 183 L271 174Z" fill="white"/>
  <!-- EV itzyo text -->
  <text x="256" y="410" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="72">
    <tspan fill="#1E40AF">EV </tspan><tspan fill="#16A34A">it</tspan><tspan fill="#CA8A04">zyo</tspan>
  </text>
</svg>
